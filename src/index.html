<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>GitHub Profile - KarolinePodlasinski83</title>

    <link rel="stylesheet" href="./styles/main.scss">
</head>

<body>

                    <span id="repos">0</span>
                </li>

                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers">0</span>
                </li>

                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following">0</span>
                </li>
            </ul>

            <a id="link" href="https://github.com/KarolinePodlasinski83"
                class="profile-link"
                target="_blank">
                Ver no GitHub
            </a>
        </div>
    </header>

    <script type="module" src="./scripts/main.js"></script>
</body>

</html>
